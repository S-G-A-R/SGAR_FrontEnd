<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrontEnd_SGAR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/registro-organizacion.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FrontEnd_SGAR.styles.css" rel="stylesheet" />
    <!-- IMPORTANTE PARA EL LOGIN NO BORRAR -->
    <!-- Fuente Lilita One -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        window.MostrarAlerta = function (opciones) {
            Swal.fire(opciones);
        }
    </script>


    <style>
        /* Personalización de la alerta 🦝 */
        .swal2-popup {
            border-radius: 25px !important;
            font-family: 'Lilita One', cursive !important;
            background: #FFFFFF !important; /* fondo cálido */
            border: 2px solid #ccc !important;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
            width: 460px !important; /* <-- ancho personalizado */
            padding: 1.5em !important; /* <-- espacio interno */
        }

        .swal2-title {
            font-size: 26px !important;
            color: #2e2e2e !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center !important;
        }

        .swal2-html-container {
            font-size: 18px !important;
            color: #444 !important;
            text-align: center !important;
            line-height: 1.4 !important;
            margin-top: 10px !important;
        }

        /* Ajustar la imagen (mapachito grande) */
        .swal2-image {
            width: 160px !important;
            height: 160px !important;
            margin: 10px auto 5px auto !important;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>


</body>

</html>
